name: Mac-app bouwen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test de MCP-koppeling
        run: node test/mcp.js
      - name: Zet het buildnummer in de app
        run: echo '{"build":${{ github.run_number }},"sha":"${{ github.sha }}"}' > app/build.json
      - name: Bouw de app (Apple Silicon)
        run: npm run dist
      - name: Zelftest van de gebouwde app op een Mac
        timeout-minutes: 3
        run: |
          T=$(mktemp -d)
          codesign --verify --deep --strict dist/mac-arm64/Collector.app
          COLLECTOR_SMOKE=1 COLLECTOR_LIBRARY="$T/lib" COLLECTOR_USERDATA="$T/ud" dist/mac-arm64/Collector.app/Contents/MacOS/Collector
          ls -la "$T/lib" "$T/lib/Beelden"
      - name: Test de gebouwde app via het echte venster (bestanden kiezen, slepen, instellingen)
        timeout-minutes: 5
        run: COLLECTOR_APP_BIN="$PWD/dist/mac-arm64/Collector.app/Contents/MacOS/Collector" node test/app.js
      - name: Test het bijwerken op de Mac (oude versie werkt zichzelf bij naar een nieuwe)
        timeout-minutes: 6
        run: node test/update-mac.js dist/mac-arm64/Collector.app
      - name: Controleer het installatievenster (achtergrond en snelkoppeling naar Programma's)
        run: |
          V=$(node -p "require('./package.json').version")
          hdiutil attach "dist/Collector-$V.dmg" -nobrowse -readonly -mountpoint /tmp/collector-dmg
          ls -la /tmp/collector-dmg /tmp/collector-dmg/.background
          test -d /tmp/collector-dmg/Collector.app && test -L /tmp/collector-dmg/Applications && ls /tmp/collector-dmg/.background | grep -q .
          hdiutil detach /tmp/collector-dmg
      - name: Pak de browserextensie in
        run: cd extension && zip -q -r ../dist/Collector-extensie.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Collector-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Breng uit als de versie in package.json nieuw is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Versie $V is al uitgebracht. Verhoog de versie in package.json voor een nieuwe release."
            exit 0
          fi
          awk '/^## /{n++} n==1 && !/^## /' WIJZIGINGEN.md > notes.md
          gh release create "v$V" "dist/Collector-$V.dmg" "dist/Collector-$V.zip" dist/Collector-extensie.zip \
            --target "$GITHUB_SHA" --title "Collector $V" --notes-file notes.md
