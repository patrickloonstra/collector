name: Mac-app bouwen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test de MCP-koppeling
        run: node test/mcp.js
      - name: Zet het buildnummer in de app
        run: echo '{"build":${{ github.run_number }},"sha":"${{ github.sha }}"}' > app/build.json
      - name: Bouw de app (Apple Silicon)
        run: npm run dist
      - name: Zelftest van de gebouwde app op een Mac
        timeout-minutes: 3
        run: |
          T=$(mktemp -d)
          codesign --verify --deep --strict dist/mac-arm64/Collector.app
          COLLECTOR_SMOKE=1 COLLECTOR_LIBRARY="$T/lib" COLLECTOR_USERDATA="$T/ud" dist/mac-arm64/Collector.app/Contents/MacOS/Collector
          ls -la "$T/lib" "$T/lib/Beelden"
      - name: Test de gebouwde app via het echte venster (bestanden kiezen, slepen, instellingen)
        timeout-minutes: 5
        run: COLLECTOR_APP_BIN="$PWD/dist/mac-arm64/Collector.app/Contents/MacOS/Collector" node test/app.js
      - name: Pak de browserextensie in
        run: cd extension && zip -q -r ../dist/Collector-extensie.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Collector-mac
          path: |
            dist/*.dmg
            dist/Collector-extensie.zip
          if-no-files-found: error
      - name: Zet de build klaar als download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.dmg dist/Collector-extensie.zip --prerelease --target "$GITHUB_SHA" \
            --title "Collector $V (build ${{ github.run_number }})" \
            --notes "Automatische build van \`${GITHUB_REF_NAME}\`. Voor een Mac met Apple-chip (M1 en nieuwer). Zie README voor de eerste keer openen."
